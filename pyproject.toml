[project]
name = "modelmatch-ai"
version = "0.1.0"
description = "Evidence-grounded multi-agent LLM selection with deterministic scoring and a FastAPI web application"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "openai-agents[litellm]>=0.22",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "google-genai>=2.33",
    "google-auth>=2.0",
]
